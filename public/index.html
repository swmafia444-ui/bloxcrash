<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMPDuel | Coinflip</title>
  <style>
    /* ==========================================================================
       1. GLOBAL RESET & BASE STYLES
       ========================================================================== */
    :root {
      --bg-main: #0b0e14;
      --bg-dark: #12141d;
      --card-bg: #1a1d29;
      --card-hover: #222636;
      --accent-pink: #ff2a8d;
      --accent-pink-hover: #e0247b;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --text-main: #ffffff;
      --text-muted: #8b92a5;
      --border-color: #262a3b;
      --success-green: #10b981;
      --danger-red: #ef4444;
      --gold-yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Scrollbar Tasarımı */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-pink);
    }

    /* ==========================================================================
       2. HEADER & NAVIGATION BAR
       ========================================================================== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
      height: 70px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1.5px;
      cursor: pointer;
    }

    .logo-container span.highlight {
      color: var(--accent-pink);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-tab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      border-radius: 8px;
      transition: all 0.2s ease;
      border-bottom: 3px solid transparent;
    }

    .nav-tab:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .nav-tab.active {
      color: var(--text-main);
      background: rgba(255, 42, 141, 0.08);
      border-bottom-color: var(--accent-pink);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-wallet-pill {
      display: flex;
      align-items: center;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 5px 15px;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .user-avatar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--accent-pink);
      cursor: pointer;
      overflow: hidden;
      background: var(--bg-dark);
    }

    .user-avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-admin {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-admin:hover {
      background: var(--accent-blue-hover);
    }

    /* ==========================================================================
       3. CONTROLS BAR & DROPDOWNS
       ========================================================================== */
    .container {
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .all-games-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .right-controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .custom-dropdown {
      position: relative;
    }

    .dropdown-btn {
      background: var(--bg-dark);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 160px;
      justify-content: space-between;
    }

    .dropdown-btn:hover {
      border-color: var(--accent-pink);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 110%;
      left: 0;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      z-index: 50;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-item {
      padding: 12px 18px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .dropdown-item:hover {
      background: rgba(255, 42, 141, 0.1);
      color: var(--accent-pink);
    }

    .btn-primary {
      background: var(--accent-pink);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: var(--accent-pink-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* ==========================================================================
       4. GAMES GRID & GAME CARDS
       ========================================================================== */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .game-card:hover {
      border-color: rgba(255, 42, 141, 0.4);
      transform: translateY(-2px);
    }

    .game-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .game-id {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .game-value {
      font-size: 16px;
      font-weight: 800;
      color: var(--gold-yellow);
    }

    .game-players {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    .player-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      overflow: hidden;
      background: var(--bg-dark);
    }

    .player-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-name {
      font-size: 14px;
      font-weight: 700;
    }

    .vs-badge {
      font-size: 12px;
      font-weight: 900;
      color: var(--accent-pink);
      background: rgba(255, 42, 141, 0.1);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .game-card-footer {
      display: flex;
      justify-content: flex-end;
    }

    /* Empty Games Message */
    .no-games-container {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px dashed var(--border-color);
    }

    .no-games-container h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    /* ==========================================================================
       5. MODAL SYSTEM & OVERLAYS
       ========================================================================== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 650px;
      position: relative;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      max-height: 90vh;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: var(--accent-pink);
    }

    /* ==========================================================================
       6. GIVEAWAY MODAL STYLES (Fotoğraf 1)
       ========================================================================== */
    .giveaway-header-stats {
      display: flex;
      gap: 15px;
      align-items: center;
      margin: 20px 0;
    }

    .badge-box {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-input {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 10px 15px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-pink);
    }

    .duration-selector {
      display: flex;
      background: var(--bg-dark);
      padding: 6px;
      border-radius: 10px;
      gap: 6px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .time-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 0;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .time-btn.active {
      background: var(--accent-pink);
      color: #fff;
      box-shadow: 0 2px 10px rgba(255, 42, 141, 0.3);
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding-right: 5px;
    }

    .inventory-item {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .inventory-item:hover {
      border-color: var(--accent-pink);
      transform: translateY(-2px);
    }

    .inventory-item.selected {
      border-color: var(--accent-pink);
      background: rgba(255, 42, 141, 0.1);
    }

    .inventory-item-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    /* ==========================================================================
       7. PROFILE MODAL STYLES (Fotoğraf 3)
       ========================================================================== */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 25px;
      margin-top: 15px;
      margin-bottom: 30px;
    }

    .avatar-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid var(--accent-pink);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      box-shadow: 0 0 20px rgba(255, 42, 141, 0.3);
      flex-shrink: 0;
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info {
      flex: 1;
    }

    .profile-info .sub-title {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .profile-info h2 {
      font-size: 26px;
      margin: 4px 0;
      font-weight: 800;
    }

    .role-text {
      font-size: 14px;
      color: var(--accent-pink);
      font-weight: 700;
      margin-bottom: 12px;
      display: block;
    }

    .btn-tip {
      background: var(--accent-pink);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-tip:hover {
      background: var(--accent-pink-hover);
    }

    .profile-stats-right {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-pill {
      background: var(--accent-pink);
      color: #fff;
      padding: 10px 22px;
      border-radius: 25px;
      display: flex;
      justify-content: space-between;
      width: 190px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(255, 42, 141, 0.25);
    }

    .profile-details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      background: var(--bg-dark);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .profile-detail-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
    }

    .profile-detail-item span {
      color: var(--text-muted);
    }

    /* ==========================================================================
       8. COINFLIP GAME VIEW MODAL (Fotoğraf 8)
       ========================================================================== */
    .view-center {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 260px;
      gap: 20px;
    }

    .btn-join-large {
      background: var(--accent-pink);
      color: #fff;
      border: none;
      padding: 18px 70px;
      font-size: 24px;
      font-weight: 900;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 42, 141, 0.4);
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-join-large:hover {
      background: var(--accent-pink-hover);
      transform: translateY(-2px);
    }

    .coin-display {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      border: 5px solid #fff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.25);
      animation: coinPulse 2s infinite alternate;
    }

    .coin-display.heads {
      background: radial-gradient(circle, #ff53a5 0%, #ff2a8d 100%);
      color: #fff;
    }

    .coin-display.tails {
      background: radial-gradient(circle, #60a5fa 0%, #3b82f6 100%);
      color: #fff;
    }

    @keyframes coinPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* ==========================================================================
       9. NOTIFICATION SYSTEM (TOAST)
       ========================================================================== */
    .toast-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 9999;
    }

    .toast {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-pink);
      padding: 15px 20px;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      animation: slideIn 0.3s ease forwards;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       HEADER / NAVIGATION BAR
       ========================================================================== -->
  <header class="navbar">
    <div class="nav-left">
      <div class="logo-container" onclick="resetView()">
        <span class="highlight">AMP</span>DUEL
      </div>
      <div class="nav-tabs">
        <div class="nav-tab active">
          <span>🪙</span>
          <span>COINFLIP</span>
        </div>
      </div>
    </div>
    <div class="nav-right">
      <button id="adminBtn" class="btn-admin" style="display: none;" onclick="openAdminPanel()">Admin Panel</button>
      <div class="user-wallet-pill">
        <span>🌸</span>
        <span id="userBalanceDisplay">0</span>
      </div>
      <div class="user-avatar-btn" onclick="openProfile(currentUser)">
        <img id="headerUserAvatar" src="" alt="Avatar">
      </div>
    </div>
  </header>

  <!-- ==========================================================================
       MAIN CONTENT CONTAINER
       ========================================================================== -->
  <main class="container">
    <div class="controls-bar">
      <!-- DÜZELTİLDİ: ALL GAMES SAYACI (Başlangıçta doğru şekilde sayar) -->
      <div class="all-games-text" id="allGamesCounter">All games (0)</div>
      
      <div class="right-controls">
        <!-- DÜZELTİLDİ: HIGH TO LOW / LOW TO HIGH DROPDOWN -->
        <div class="custom-dropdown">
          <button class="dropdown-btn" onclick="toggleDropdown(event)">
            <span id="selectedSortText">High to low</span>
            <span>▼</span>
          </button>
          <div class="dropdown-menu" id="sortDropdownMenu">
            <div class="dropdown-item" onclick="changeSort('high')">High to low</div>
            <div class="dropdown-item" onclick="changeSort('low')">Low to high</div>
          </div>
        </div>

        <button class="btn-primary" onclick="openGiveawayModal()">
          <span>+</span> Create Giveaway
        </button>
      </div>
    </div>

    <!-- OYUN KARTLARI IZGARASI -->
    <div class="games-grid" id="gamesGrid">
      <!-- Dinamik Oyunlar Burada Render Edilir -->
    </div>
  </main>

  <!-- ==========================================================================
       MODAL 1: CREATE GIVEAWAY (Fotoğraf 1)
       ========================================================================== -->
  <div class="modal-overlay" id="giveawayModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal('giveawayModal')">&times;</button>
      <h2 style="font-weight: 800; font-size: 22px;">Create Giveaway</h2>
      
      <div class="giveaway-header-stats">
        <div class="badge-box">Prize value 🌸 <span id="prizeVal">0</span></div>
        <div class="badge-box"><span id="selectedItemCount">0</span>/20 ITEMS</div>
        <input type="text" class="search-input" id="giveawaySearchInput" placeholder="Search items..." oninput="filterGiveawayInventory()">
      </div>

      <div class="duration-selector">
        <button class="time-btn" onclick="selectDuration(this, 1)">1 min</button>
        <button class="time-btn active" onclick="selectDuration(this, 5)">5 min</button>
        <button class="time-btn" onclick="selectDuration(this, 10)">10 min</button>
        <button class="time-btn" onclick="selectDuration(this, 30)">30 min</button>
        <button class="time-btn" onclick="selectDuration(this, 60)">60 min</button>
      </div>

      <!-- DÜZELTİLDİ: Envanterde pet yoksa alan tamamen gizlenir -->
      <div class="inventory-grid" id="giveawayInventoryGrid"></div>

      <button class="btn-primary" style="width: 100%; padding: 14px; font-size: 16px; justify-content: center;" onclick="createGiveawaySubmit()">Create Giveaway</button>
    </div>
  </div>

  <!-- ==========================================================================
       MODAL 2: USER PROFILE & ROBLOX AVATAR (Fotoğraf 3)
       ========================================================================== -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal('profileModal')">&times;</button>
      
      <div class="profile-header">
        <div class="avatar-ring">
          <img id="profAvatar" src="" alt="Roblox Avatar">
        </div>
        <div class="profile-info">
          <span class="sub-title">Profile of</span>
          <h2 id="profUsername">Username</h2>
          <span class="role-text" id="profRoleLevel">User · Level 1</span>
          <!-- DÜZELTİLDİ: Tip Gönderme Butonu -->
          <button class="btn-tip" onclick="sendTipToCurrentProfile()">Send tip</button>
        </div>
        <div class="profile-stats-right">
          <div class="stat-pill">
            <span>PROFIT</span>
            <span id="profProfit">0</span>
          </div>
          <div class="stat-pill">
            <span>WAGERED</span>
            <span id="profWagered">0</span>
          </div>
        </div>
      </div>

      <div class="profile-details-grid">
        <div class="profile-detail-item"><span>Games played</span> <strong id="pGamesPlayed">0</strong></div>
        <div class="profile-detail-item"><span>Games won</span> <strong id="pGamesWon">0</strong></div>
        <div class="profile-detail-item"><span>Games lost</span> <strong id="pGamesLost">0</strong></div>
        <div class="profile-detail-item"><span>Win rate</span> <strong id="pWinRate">0%</strong></div>
        <div class="profile-detail-item"><span>Role</span> <strong id="pRole">USER</strong></div>
        <div class="profile-detail-item"><span>Joined</span> <strong id="pJoined">2026</strong></div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       MODAL 3: COINFLIP GAME VIEW / SPECTATE (Fotoğraf 8)
       ========================================================================== -->
  <div class="modal-overlay" id="viewModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal('viewModal')">&times;</button>
      <!-- DÜZELTİLDİ: Join Butonu veya Kurucunun Seçtiği Taraf -->
      <div class="view-center" id="viewCenterContainer">
        <!-- JS Dinamik Render Edecek -->
      </div>
    </div>
  </div>

  <!-- BİLDİRİM TOAST ALANI -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ==========================================================================
       JAVASCRIPT UYGULAMA MANTIĞI & SİSTEMLER
       ========================================================================== -->
  <script>
    /* ==========================================================================
       1. GLOBAL STATE & USER DATA
       ========================================================================== */
    // DÜZELTİLDİ: 'emoxdrill' yetkisi ve Roblox Entegrasyonu
    let currentUser = {
      username: "emoxdrill",
      robloxId: "1",
      level: 67,
      profit: "6.1m",
      wagered: "11.5m",
      balance: 15400,
      inventory: [
        { id: 101, name: "Fly Ride Frost Dragon", value: 1000, img: "https://via.placeholder.com/40/ff2a8d/ffffff?text=Pet" },
        { id: 102, name: "Shadow Dragon", value: 2500, img: "https://via.placeholder.com/40/3b82f6/ffffff?text=Pet" }
      ]
    };

    let selectedGiveawayItems = [];
    let giveawayDuration = 5;
    let targetProfileUser = null;
    let activeSortOrder = 'high';
    
    // Sistemdeki Aktif Oyunlar Listesi (Başlangıçta 0 Maç)
    let gamesList = [];

    /* ==========================================================================
       2. INITIALIZATION & ROUTING SETUP
       ========================================================================== */
    document.addEventListener("DOMContentLoaded", () => {
      // DÜZELTİLDİ: URL güncellenmesi ve Başlık Kurulumu
      if (window.location.pathname !== '/coinflip') {
        window.history.pushState({}, '', '/coinflip');
      }
      document.title = "AMPDuel | Coinflip";

      // DÜZELTİLDİ: Admin Panel Yetki Kontrolü
      checkAdminPermission();

      // UI Güncellemeleri
      updateUserHeaderUI();
      updateAllGamesCount();
      renderGamesGrid();
    });

    function updateUserHeaderUI() {
      document.getElementById("userBalanceDisplay").innerText = currentUser.balance.toLocaleString();
      
      const avatarUrl = currentUser.robloxId 
        ? `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${currentUser.robloxId}&size=150x150&format=Png&isCircular=true`
        : 'https://via.placeholder.com/150';
      
      document.getElementById("headerUserAvatar").src = avatarUrl;
    }

    /* ==========================================================================
       3. ADMIN PANEL SYSTEM (emoxdrill)
       ========================================================================== */
    function checkAdminPermission() {
      const allowedAdmins = ["emoxdrill", "admin"];
      const adminBtn = document.getElementById("adminBtn");
      
      if (allowedAdmins.includes(currentUser.username)) {
        adminBtn.style.display = "block";
      } else {
        adminBtn.style.display = "none";
      }
    }

    function openAdminPanel() {
      showToast("Admin Paneline Yönlendiriliyorsunuz...");
    }

    /* ==========================================================================
       4. GAMES COUNT & DROPDOWN SORT SYSTEM
       ========================================================================== */
    // DÜZELTİLDİ: All Games Sayacı
    function updateAllGamesCount() {
      const counterEl = document.getElementById("allGamesCounter");
      if (counterEl) {
        counterEl.innerText = `All games (${gamesList.length})`;
      }
    }

    function toggleDropdown(e) {
      e.stopPropagation();
      document.getElementById("sortDropdownMenu").classList.toggle("show");
    }

    window.addEventListener('click', () => {
      const dropdown = document.getElementById("sortDropdownMenu");
      if (dropdown && dropdown.classList.contains("show")) {
        dropdown.classList.remove("show");
      }
    });

    // DÜZELTİLDİ: Sıralama Mantığı
    function changeSort(type) {
      activeSortOrder = type;
      const label = document.getElementById("selectedSortText");
      
      if (type === 'high') {
        label.innerText = "High to low";
        gamesList.sort((a, b) => b.value - a.value);
      } else {
        label.innerText = "Low to high";
        gamesList.sort((a, b) => a.value - b.value);
      }
      
      renderGamesGrid();
    }

    /* ==========================================================================
       5. GIVEAWAY MODAL & INVENTORY SYSTEM
       ========================================================================== */
    function openGiveawayModal() {
      selectedGiveawayItems = [];
      updateGiveawayStats();
      renderGiveawayInventory();
      openModal("giveawayModal");
    }

    function selectDuration(btn, mins) {
      giveawayDuration = mins;
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // DÜZELTİLDİ: Envanter Boşsa Alanı Gizleme
    function renderGiveawayInventory() {
      const grid = document.getElementById("giveawayInventoryGrid");
      grid.innerHTML = "";

      if (!currentUser.inventory || currentUser.inventory.length === 0) {
        grid.style.display = "none";
        return;
      }

      grid.style.display = "grid";
      currentUser.inventory.forEach(item => {
        const itemEl = document.createElement("div");
        itemEl.className = `inventory-item ${selectedGiveawayItems.includes(item.id) ? 'selected' : ''}`;
        itemEl.onclick = () => toggleSelectInventoryItem(item.id);
        itemEl.innerHTML = `
          <img src="${item.img}" class="inventory-item-img" alt="Pet">
          <span>${item.name}</span>
          <span style="color: var(--gold-yellow);">${item.value}</span>
        `;
        grid.appendChild(itemEl);
      });
    }

    function filterGiveawayInventory() {
      const query = document.getElementById("giveawaySearchInput").value.toLowerCase();
      const items = document.querySelectorAll(".inventory-item");
      items.forEach(item => {
        const text = item.innerText.toLowerCase();
        item.style.display = text.includes(query) ? "flex" : "none";
      });
    }

    function toggleSelectInventoryItem(id) {
      if (selectedGiveawayItems.includes(id)) {
        selectedGiveawayItems = selectedGiveawayItems.filter(itemId => itemId !== id);
      } else {
        if (selectedGiveawayItems.length >= 20) {
          showToast("Maksimum 20 eşya seçebilirsiniz!");
          return;
        }
        selectedGiveawayItems.push(id);
      }
      updateGiveawayStats();
      renderGiveawayInventory();
    }

    function updateGiveawayStats() {
      const totalVal = selectedGiveawayItems.reduce((acc, id) => {
        const item = currentUser.inventory.find(i => i.id === id);
        return acc + (item ? item.value : 0);
      }, 0);

      document.getElementById("prizeVal").innerText = totalVal.toLocaleString();
      document.getElementById("selectedItemCount").innerText = selectedGiveawayItems.length;
    }

    function createGiveawaySubmit() {
      if (selectedGiveawayItems.length === 0) {
        showToast("Lütfen en az 1 pet seçin!");
        return;
      }

      showToast("Giveaway başarıyla oluşturuldu!");
      closeModal("giveawayModal");
    }

    /* ==========================================================================
       6. PROFILE MODAL & TIP SYSTEM
       ========================================================================== */
    function openProfile(user) {
      targetProfileUser = user;
      
      // DÜZELTİLDİ: Roblox Headshot API Entegrasyonu
      const avatarUrl = user.robloxId 
        ? `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${user.robloxId}&size=150x150&format=Png&isCircular=true`
        : 'https://via.placeholder.com/150';

      document.getElementById("profAvatar").src = avatarUrl;
      document.getElementById("profUsername").innerText = user.username;
      document.getElementById("profRoleLevel").innerText = `${user.role || 'User'} · Level ${user.level || 1}`;
      document.getElementById("profProfit").innerText = user.profit || '0';
      document.getElementById("profWagered").innerText = user.wagered || '0';

      document.getElementById("pGamesPlayed").innerText = user.gamesPlayed || 0;
      document.getElementById("pGamesWon").innerText = user.gamesWon || 0;
      document.getElementById("pGamesLost").innerText = user.gamesLost || 0;
      document.getElementById("pWinRate").innerText = user.winRate || "0%";
      document.getElementById("pRole").innerText = (user.username === 'emoxdrill') ? 'ADMIN' : 'USER';

      openModal("profileModal");
    }

    // DÜZELTİLDİ: Tip (Pet Gönderme) Mantığı
    function sendTipToCurrentProfile() {
      if (!currentUser.inventory || currentUser.inventory.length === 0) {
        showToast("Gönderilecek pet bulunamadı!");
        return;
      }

      if (targetProfileUser.username === currentUser.username) {
        showToast("Kendinize tip gönderemezsiniz!");
        return;
      }

      const tippedItem = currentUser.inventory.shift();
      
      if (!targetProfileUser.inventory) targetProfileUser.inventory = [];
      targetProfileUser.inventory.push(tippedItem);

      showToast(`${tippedItem.name} eşyası ${targetProfileUser.username} kullanıcısına aktarıldı!`);
      closeModal("profileModal");
    }

    /* ==========================================================================
       7. COINFLIP VIEW & JOIN SYSTEM
       ========================================================================== */
    function openViewModal(game) {
      const container = document.getElementById("viewCenterContainer");
      container.innerHTML = "";

      // DÜZELTİLDİ: İkinci oyuncu yoksa JOIN Butonu, varsa Kurucunun Seçtiği Taraf
      if (!game.player2) {
        const joinBtn = document.createElement("button");
        joinBtn.className = "btn-join-large";
        joinBtn.innerText = "JOIN";
        joinBtn.onclick = () => {
          game.player2 = currentUser.username;
          showToast("Oyuna başarıyla katıldınız!");
          closeModal("viewModal");
          renderGamesGrid();
        };
        container.appendChild(joinBtn);
      } else {
        const coin = document.createElement("div");
        coin.className = `coin-display ${game.selectedSide}`;
        coin.innerText = game.selectedSide.toUpperCase();
        container.appendChild(coin);
      }

      openModal("viewModal");
    }

    /* ==========================================================================
       8. RENDERERS & HELPER FUNCTIONS
       ========================================================================== */
    function renderGamesGrid() {
      const grid = document.getElementById("gamesGrid");
      grid.innerHTML = "";

      if (gamesList.length === 0) {
        grid.innerHTML = `
          <div class="no-games-container">
            <h3>Henüz aktif coinflip oyunu bulunmuyor</h3>
            <p style="color: var(--text-muted); font-size: 14px;">"Create Giveaway" butonuna tıklayarak ilk oyunu başlatabilirsiniz.</p>
          </div>
        `;
        return;
      }

      gamesList.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
          <div class="game-card-header">
            <span class="game-id">Game #${game.id}</span>
            <span class="game-value">🌸 ${game.value.toLocaleString()}</span>
          </div>
          <div class="game-players">
            <div class="player-box">
              <div class="player-avatar">
                <img src="${game.player1Avatar || 'https://via.placeholder.com/45'}" alt="P1">
              </div>
              <span class="player-name">${game.player1}</span>
            </div>
            <span class="vs-badge">VS</span>
            <div class="player-box">
              <span class="player-name">${game.player2 || 'Bekleniyor...'}</span>
              <div class="player-avatar">
                <img src="${game.player2Avatar || 'https://via.placeholder.com/45'}" alt="P2">
              </div>
            </div>
          </div>
          <div class="game-card-footer">
            <button class="btn-primary" onclick='openViewModal(${JSON.stringify(game)})'>View</button>
          </div>
        `;
        grid.appendChild(card);
      });

      updateAllGamesCount();
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.classList.add("active");
      }
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.classList.remove("active");
      }
    }

    function resetView() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showToast(msg) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerText = msg;
      container.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 3000);
    }
  </script>
</body>
</html>
